<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1440" height="900" fill="#0C0C14"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="900" fill="#141422"/>
  <rect x="40" y="40" width="40" height="40" rx="8" fill="#A5D6B7"/>
  <text x="96" y="68" fill="white" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800">SKUL MOGULZ</text>
  
  <!-- Sidebar Nav -->
  <text x="40" y="150" fill="#A5D6B7" font-family="Plus Jakarta Sans" font-size="14" font-weight="600">DASHBOARD</text>
  <text x="40" y="200" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14">PROJECTS</text>
  <text x="40" y="250" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14">THE ARENA</text>
  <text x="40" y="300" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14">THE BUNKER</text>
  
  <!-- Profile Card in Sidebar -->
  <rect x="20" y="760" width="240" height="100" rx="16" fill="#1C1C2D"/>
  <circle cx="60" cy="810" r="24" fill="#333"/>
  <text x="100" y="805" fill="white" font-family="Plus Jakarta Sans" font-size="14" font-weight="700">Gideon Dadey</text>
  <rect x="100" y="815" width="60" height="20" rx="4" fill="#A5D6B7"/>
  <text x="108" y="830" fill="white" font-family="Plus Jakarta Sans" font-size="10" font-weight="800">TITAN</text>

  <!-- Main Content Header -->
  <text x="320" y="70" fill="white" font-family="Plus Jakarta Sans" font-size="32" font-weight="800">LAUNCHPAD</text>
  <text x="320" y="100" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="16">Active student projects ready for liftoff.</text>

  <!-- Project Card 1 -->
  <rect x="320" y="160" width="760" height="200" rx="24" fill="#141422" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="344" y="184" width="120" height="152" rx="16" fill="#1C1C2D"/>
  <text x="488" y="210" fill="white" font-family="Plus Jakarta Sans" font-size="24" font-weight="700">Solar-Wing Drones</text>
  <text x="488" y="235" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14">Autonomous delivery drones for campus logistics.</text>
  
  <!-- Progress Bar -->
  <rect x="488" y="270" width="560" height="8" rx="4" fill="#1C1C2D"/>
  <rect x="488" y="270" width="420" height="8" rx="4" fill="#A5D6B7"/>
  <text x="488" y="300" fill="#A5D6B7" font-family="Plus Jakarta Sans" font-size="12" font-weight="700">75% FUNDED</text>
  <text x="1000" y="300" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="12" text-anchor="end">$15,000 / $20,000</text>

  <!-- Right Panel: The Arena -->
  <rect x="1120" y="0" width="320" height="900" fill="#141422"/>
  <text x="1152" y="70" fill="white" font-family="Plus Jakarta Sans" font-size="20" font-weight="800">THE ARENA</text>
  
  <!-- Leaderboard Entry 1 -->
  <rect x="1136" y="120" width="288" height="60" rx="12" fill="#1C1C2D"/>
  <text x="1152" y="155" fill="white" font-family="Plus Jakarta Sans" font-size="14" font-weight="600">1. Jaxson K.</text>
  <text x="1390" y="155" fill="#A5D6B7" font-family="Plus Jakarta Sans" font-size="14" font-weight="800" text-anchor="end">9,850</text>

  <!-- Leaderboard Entry 2 -->
  <rect x="1136" y="190" width="288" height="60" rx="12" fill="transparent" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <text x="1152" y="225" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14">2. Elara V.</text>
  <text x="1390" y="225" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14" text-anchor="end">9,720</text>

  <!-- Leaderboard Entry 3 -->
  <rect x="1136" y="260" width="288" height="60" rx="12" fill="transparent" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <text x="1152" y="295" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14">3. Kai R.</text>
  <text x="1390" y="295" fill="#A1A1AA" font-family="Plus Jakarta Sans" font-size="14" text-anchor="end">8,900</text>

  <!-- Floating Glow FX -->
  <circle cx="1440" cy="0" r="300" fill="#A5D6B7" fill-opacity="0.05"/>
</svg>
